name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # GITHUB_TOKEN pushes images to GHCR
  checks: write            # test-reporter publishes the test results as a check run

env:
  # Matches the postgres:16 image the compose files run, so tests exercise the same server.
  TEST_POSTGRES_DB: homassy
  TEST_POSTGRES_USER: homassy_user
  TEST_POSTGRES_PASSWORD: homassy_ci_password

jobs:
  # ---------------------------------------------------------------------------------------
  # Verification. Runs on pull requests and on master; nothing reaches GHCR or the VPS until
  # it passes.
  # ---------------------------------------------------------------------------------------
  test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homassy
          POSTGRES_USER: homassy_user
          POSTGRES_PASSWORD: homassy_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homassy_user -d homassy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Write test configuration
        # Homassy.Tests/appsettings.Testing.json is gitignored (it holds a local connection
        # string), and HomassyWebApplicationFactory reads it when present. Writing it here is
        # what turns "you need a hand-made config file and a Postgres on 5432" from tribal
        # knowledge into a step anyone can read.
        run: |
          cat > Homassy.Tests/appsettings.Testing.json <<JSON
          {
            "Logging": {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft.AspNetCore": "Warning",
                "Microsoft.EntityFrameworkCore": "Warning"
              }
            },
            "ConnectionStrings": {
              "DefaultConnection": "Host=localhost;Port=5432;Database=${TEST_POSTGRES_DB};Username=${TEST_POSTGRES_USER};Password=${TEST_POSTGRES_PASSWORD}"
            },
            "Kratos": {
              "PublicUrl": "http://localhost:4433",
              "AdminUrl": "http://localhost:4434",
              "SessionCookieName": "ory_kratos_session",
              "WebhookSecret": "test-secret"
            },
            "ProductSettings": { "ExpiringSoonThresholdDays": 7 },
            "RateLimiting": {
              "GlobalMaxAttempts": "1000",
              "GlobalWindowMinutes": "1",
              "EndpointMaxAttempts": "500",
              "EndpointWindowMinutes": "1"
            },
            "Cors": { "AllowedOrigins": [ "http://localhost:3000" ] },
            "Security": {
              "AccountLockout": { "MaxFailedAttempts": 5, "LockoutDurationMinutes": 15 }
            },
            "InternalApi": { "ApiKey": "ci-internal-api-key" },
            "RegistrationEnabled": true
          }
          JSON

      - name: Restore
        run: dotnet restore Homassy.slnx

      - name: Build
        # -warnaserror: a new compiler warning fails here rather than being noticed later.
        # The NuGet vulnerability audit is exempted in Directory.Build.props and reported by
        # its own step below.
        run: dotnet build Homassy.slnx --no-restore -warnaserror

      - name: Apply database migrations
        # The integration tests run against a real schema, exactly as they do locally.
        run: dotnet run --project Homassy.Migrator --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=${{ env.TEST_POSTGRES_DB }};Username=${{ env.TEST_POSTGRES_USER }};Password=${{ env.TEST_POSTGRES_PASSWORD }}

      - name: Test
        run: >-
          dotnet test Homassy.slnx --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true    # never let report publishing decide whether the build passed
        with:
          name: .NET test results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Report vulnerable packages
        # Advisory, not a gate: an advisory published overnight must not turn an untouched
        # commit red. See the NoWarn note in Directory.Build.props.
        if: always()
        continue-on-error: true
        run: |
          echo '### Vulnerable NuGet packages' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dotnet list Homassy.slnx package --vulnerable --include-transitive >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Lint & typecheck (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # matches the runtime in Homassy.Web/Dockerfile
          cache: npm
          cache-dependency-path: Homassy.Web/package-lock.json

      - name: Install
        # postinstall runs `nuxt prepare`, which generates .nuxt/eslint.config.mjs and the
        # types both steps below need.
        run: npm ci
        working-directory: Homassy.Web

      - name: Lint
        # NOT a gate yet: the app currently has a backlog of eslint errors that predate this
        # workflow. The step runs so the count is visible on every PR; flip continue-on-error
        # off once the backlog is cleared.
        run: npm run lint
        working-directory: Homassy.Web
        continue-on-error: true

      - name: Typecheck
        # Same: a pre-existing backlog of type errors. Advisory until it is cleared.
        run: npm run typecheck
        working-directory: Homassy.Web
        continue-on-error: true

  # ---------------------------------------------------------------------------------------
  # Release. Skipped entirely on pull requests, which get verification only.
  # ---------------------------------------------------------------------------------------
  prepare:
    name: Compute image tag
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Compute date+time tag (one value shared by all images)
        id: meta
        run: echo "tag=$(TZ=Europe/Budapest date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push images
    # `test` gates this, so a failing test stops the pipeline before any image is pushed.
    # `prepare` has no dependency on `test`, so the two run in parallel.
    needs: [prepare, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: homassyapi,           file: Homassy.API/Dockerfile,           context: ., target: final }
          - { name: homassyemail,         file: Homassy.Email/Dockerfile,         context: ., target: final }
          - { name: homassynotifications, file: Homassy.Notifications/Dockerfile, context: ., target: final }
          - { name: homassymigrator,      file: Homassy.Migrator/Dockerfile,      context: ., target: final }
          - { name: homassyweb,           file: Homassy.Web/Dockerfile,           context: Homassy.Web, target: production }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/xentinus/${{ matrix.name }}:${{ needs.prepare.outputs.tag }}
            ghcr.io/xentinus/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Xentinus/Homassy
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_KRATOS_URL=${{ vars.NUXT_PUBLIC_KRATOS_URL }}
            NUXT_PUBLIC_API_BASE=${{ vars.NUXT_PUBLIC_API_BASE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production          # manual approval gate (required reviewers)
    steps:
      - uses: actions/checkout@v4

      - name: Write production .env
        run: |
          printf '%s\n' "${{ secrets.PROD_ENV }}" > .env
          {
            echo "DOCKER_REGISTRY=ghcr.io/xentinus/"
            echo "IMAGE_TAG=${{ needs.prepare.outputs.tag }}"
          } >> .env

      - name: Prepare VPS deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            # Docker auto-creates a missing bind-mount source as an empty directory.
            # Prior deploys never shipped these Kratos files, so they exist as dirs on the
            # VPS and block the scp untar (file-vs-directory). Reset the dir to land real files.
            rm -rf /opt/homassy/Homassy.Kratos
            mkdir -p /opt/homassy/Homassy.Kratos
            rm -rf /opt/homassy/Homassy.Proxy
            mkdir -p /opt/homassy/Homassy.Proxy

      - name: Sync compose + Kratos config + .env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.production.yml,.env,Homassy.Kratos/identity.schema.json,Homassy.Kratos/webhook_body.jsonnet,Homassy.Kratos/init-kratos-schema.sql,Homassy.Kratos/kratos.production.yml,Homassy.Proxy/Caddyfile"
          target: /opt/homassy
          overwrite: true

      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GHCR_PAT,GHCR_USERNAME
          script: |
            set -e
            cd /opt/homassy
            mv -f Homassy.Kratos/kratos.production.yml Homassy.Kratos/kratos.yml
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            n=0
            until docker compose -f docker-compose.production.yml pull; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "docker compose pull failed after $n attempts" >&2
                exit 1
              fi
              echo "pull attempt $n failed (transient registry error), retrying in 10s..."
              sleep 10
            done
            docker compose -f docker-compose.production.yml up -d --wait --remove-orphans
            docker image prune -f
            docker logout ghcr.io
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
