name: homassy

services:
  postgres:
    container_name: homassy-postgres
    image: postgres:16
    ports:
      # Loopback-only: reachable from the dev machine, not from the LAN. Unlike the app ports
      # below this one ignores HOST_BIND — nothing about testing from a phone needs the database.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Homassy.Kratos/init-kratos-schema.sql:/docker-entrypoint-initdb.d/init-kratos-schema.sql:ro
    networks:
      - homassy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  homassy.migrator:
    container_name: homassy-migrator
    image: ${DOCKER_REGISTRY-}homassymigrator
    build:
      context: .
      dockerfile: Homassy.Migrator/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DATABASE_HOST};Port=${DATABASE_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    networks:
      - homassy-network 
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  homassy.kratos:
    container_name: homassy-kratos
    image: oryd/kratos:v1.2.0
    ports:
      - "${HOST_BIND:-127.0.0.1}:4433:4433"
      # The admin API authenticates nobody — Ory's model is that it is reachable only from a
      # trusted network — so unlike the public port this one ignores HOST_BIND and stays on
      # loopback under every configuration. It is published at all because the API and the
      # Migrator default Kratos:AdminUrl to http://localhost:4434 when they run outside Docker,
      # which is the "Local development (individual services)" flow in README.md. Inside Docker
      # they use http://homassy-kratos:4434 over homassy-network and never touch this binding.
      - "127.0.0.1:4434:4434"
    environment:
      # Database connection (Kratos standard env var)
      - DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${POSTGRES_DB}?sslmode=disable&search_path=kratos
      # Secrets (Kratos standard env vars). No fallback on purpose: a default here lets the stack
      # come up on a secret that is published in this file, and nothing says so at runtime.
      - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET:?set KRATOS_COOKIE_SECRET in .env}
      - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET:?set KRATOS_CIPHER_SECRET in .env (exactly 32 characters)}
      # Global internal service-to-service API key (used to authenticate the courier webhook to Homassy.Email)
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./Homassy.Kratos/kratos.development.yml:/etc/config/kratos/kratos.yml:ro
      - ./Homassy.Kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
      - ./Homassy.Kratos/webhook_body.jsonnet:/etc/config/kratos/webhook_body.jsonnet:ro
    entrypoint: /bin/sh
    command: ["-c", "sed \"s|REPLACE_INTERNAL_API_KEY|${INTERNAL_API_KEY}|g\" /etc/config/kratos/kratos.yml > /tmp/kratos.yml && kratos migrate sql -e --yes -c /tmp/kratos.yml && kratos serve -c /tmp/kratos.yml --dev --watch-courier"]
    networks:
      - homassy-network
    depends_on:
      postgres:
        condition: service_healthy
      homassy.email:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4433/health/alive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  homassy.api:
    container_name: homassy-api
    image: ${DOCKER_REGISTRY-}homassyapi
    build:
      context: .
      dockerfile: Homassy.API/Dockerfile
    # Longer than GracefulShutdown:TimeoutSeconds (30s), so the drain decides when the process
    # stops. Docker's default is 10s, which used to SIGKILL the container before in-flight
    # requests had finished and before Serilog had flushed (#85). An idle API still stops at once.
    stop_grace_period: 45s
    ports:
      - "${HOST_BIND:-127.0.0.1}:5226:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${DATABASE_HOST};Port=${DATABASE_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - Kratos__PublicUrl=http://homassy-kratos:4433
      - Kratos__AdminUrl=http://homassy-kratos:4434
      - RegistrationEnabled=${REGISTRATION_ENABLED:-true}
      - NotificationsService__BaseUrl=http://homassy-notifications:8080
      - InternalApi__ApiKey=${INTERNAL_API_KEY:-dev-internal-api-key}
      - WebPush__VapidPublicKey=${VAPID_PUBLIC_KEY}
    networks:
      - homassy-network
    depends_on:
      postgres:
        condition: service_healthy
      homassy.migrator:
        condition: service_completed_successfully
      homassy.kratos:
        condition: service_healthy
      homassy.notifications:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1.0/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  homassy.web:
    container_name: homassy-web
    image: ${DOCKER_REGISTRY-}homassyweb
    build:
      context: ./Homassy.Web
      dockerfile: Dockerfile
      target: development
    ports:
      - "${HOST_BIND:-127.0.0.1}:3000:3000"
    environment:
      - NODE_ENV=development
      # Inside the container the dev server must listen on every interface, or the docker-proxy
      # (which connects to the container IP, not its loopback) cannot reach it. The host-side
      # binding above is what keeps the LAN out. Outside Docker the default in nuxt.config.ts
      # applies and the dev server is loopback-only.
      - NUXT_DEV_HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE=http://localhost:5226
      - NUXT_PUBLIC_KRATOS_URL=http://localhost:4433
      - NUXT_PUBLIC_SITE_URL=http://localhost:3000
    volumes:
      - ./Homassy.Web:/app
      - /app/node_modules
    networks:
      - homassy-network
    depends_on:
      postgres:
        condition: service_healthy
      homassy.api:
        condition: service_healthy
      homassy.kratos:
        condition: service_healthy

  homassy.email:
    container_name: homassy-email
    image: ${DOCKER_REGISTRY-}homassyemail
    build:
      context: .
      dockerfile: Homassy.Email/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Email__SmtpServer=${EMAIL_SMTP_SERVER}
      - Email__SmtpPort=${EMAIL_SMTP_PORT}
      - Email__SenderEmail=${EMAIL_SENDER_EMAIL}
      - Email__Username=${EMAIL_USERNAME}
      - Email__Password=${EMAIL_PASSWORD}
      - InternalApi__ApiKey=${INTERNAL_API_KEY}
    networks:
      - homassy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  homassy.notifications:
    container_name: homassy-notifications
    image: ${DOCKER_REGISTRY-}homassynotifications
    build:
      context: .
      dockerfile: Homassy.Notifications/Dockerfile
    # Eight background workers, each of which should finish the cycle it is in rather than be
    # killed mid-send. The window itself is HostOptions.ShutdownTimeout in this service's
    # Program.cs (30s); this only keeps Docker from SIGKILLing the container before it is up.
    stop_grace_period: 45s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${DATABASE_HOST};Port=${DATABASE_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WebPush__VapidSubject=${VAPID_SUBJECT:-mailto:noreply@homassy.com}
      - WebPush__VapidPublicKey=${VAPID_PUBLIC_KEY}
      - WebPush__VapidPrivateKey=${VAPID_PRIVATE_KEY}
      - InternalApi__ApiKey=${INTERNAL_API_KEY:-dev-internal-api-key}
      - EmailService__BaseUrl=http://homassy-email:8080
      - HomassyApi__BaseUrl=http://homassy-api:8080
    networks:
      - homassy-network
    depends_on:
      postgres:
        condition: service_healthy
      homassy.migrator:
        condition: service_completed_successfully
      homassy.email:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  homassy-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
